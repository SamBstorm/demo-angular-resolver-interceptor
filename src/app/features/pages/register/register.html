<h1>Venez nous rejoindre!</h1>
<h2>Juste compléter ce formulaire :</h2>
@if(notifMsg){
    <div>
        <p>{{notifMsg}}</p>
    </div>
}
<form [formGroup]="formRegister" (submit)="onSubmit()">
    <!-- div*4>label+input -->
    <div>
        <label for="email">Adresse email :</label>
        <input id="email" name="email" formControlName="email" type="email">
    </div>
    <div>
        <label for="password">Mot de passe :</label>
        <input id="password" name="password" formControlName="password"  type="password">
    </div>
    <div>
        <label for="firstname">Prénom : </label>
        <input id="firstname" name="firstname" formControlName="firstname"  type="text">
    </div>
    <div>
        <label for="lastname">Nom de famille : </label>
        <input id="lastname" name="lastname" formControlName="lastname"  type="text">
    </div>
    <div>
        <button type="submit">S'inscrire</button>
    </div>
</form>
