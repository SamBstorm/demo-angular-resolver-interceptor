<h1>Ajouter un nouveau livre</h1>
<h2>Veuillez remplir les informations de votre livre :</h2>
<form [formGroup]="formCreateBook" (submit)="onSubmit()">
    <div>
        <label for="title">Titre : </label>
        <input id="title" name="title" formControlName="title"  type="text">
    </div>
    <div>
        <label for="author">Auteur : </label>
        <input id="author" name="author" formControlName="author"  type="text">
    </div>
    <div>
        <label for="isbn">ISBN : </label>
        <input id="isbn" name="isbn" formControlName="isbn"  type="text">
    </div>
    <div>
        <label for="description">Description : </label>
        <input id="description" name="description" formControlName="description"  type="text">
    </div>
    <div>
        <label for="releaseDate">Date de parution : </label>
        <input id="releaseDate" name="releaseDate" formControlName="releaseDate"  type="date">
    </div>
    <div>
        <button type="submit">Enregistrer</button>
    </div>
</form>
